apiVersion: batch/v1
kind: CronJob
metadata:
  name: pythonapp-cronjob

spec:
  schedule: "*/1 * * * *"

  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: cron-container
              image: busybox:latest
              command:
                - sh
                - -c
                - echo "CronJob executed at $(date)"

          restartPolicy: OnFailure
