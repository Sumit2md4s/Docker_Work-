<!DOCTYPE html>
<html>

<head>

    <title>Docker 3-Tier Application</title>

</head>

<body>

    <h1>Docker 3-Tier Application</h1>

    <p id="backend-response">
        Calling backend...
    </p>


    <script>

        fetch("/api")

            .then(response => {

                if (!response.ok) {
                    throw new Error(
                        "Backend returned HTTP " + response.status
                    );
                }

                return response.text();
            })

            .then(data => {

                document.getElementById(
                    "backend-response"
                ).innerText = data;

            })

            .catch(error => {

                document.getElementById(
                    "backend-response"
                ).innerText =
                    "Backend connection failed: " + error;

            });

    </script>

</body>

</html>
